[package]
name = "lfsplanet"
version = "0.1.0"
edition = "2024"
publish = false
homepage = "https://github.com/theangryangel/lfspla.net/"

[features]
default = ["aws"]
aws = ["object_store/aws"]
azure = ["object_store/azure"]
gcp = ["object_store/gcp"]
http = ["object_store/http"]
test-database = ["lfsplanet_core/test-database", "lfsplanet_hotlaps/test-database", "lfsplanet_race_calendar/test-database"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation and attribute conventions this crate does not follow.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Control configuration and API payloads are genuinely flag sets.
struct_excessive_bools = "allow"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
axum-response-cache = "0.5"
bytes = "1"
celes = "3.0.0"
clap = "4"
csv = "1"
encoding_rs = "0.8"
fake = { version = "5", features = ["derive"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
insim = { git = "https://github.com/theangryangel/insim.rs.git", rev = "604d801ff8ff45780c9d7b0b0125e395933bb72a", features = ["serde"] }
insim_core = { git = "https://github.com/theangryangel/insim.rs.git", rev = "604d801ff8ff45780c9d7b0b0125e395933bb72a", features = ["serde"] }
insim_extra = { git = "https://github.com/theangryangel/insim.rs.git", rev = "604d801ff8ff45780c9d7b0b0125e395933bb72a" }
insim_pth = { git = "https://github.com/theangryangel/insim.rs.git", rev = "604d801ff8ff45780c9d7b0b0125e395933bb72a" }
itertools = "0.15"
lfsplanet_core = { path = "crates/lfsplanet_core" }
lfsplanet_country_ext = { path = "crates/lfsplanet_country_ext", features = ["sea-orm"] }
lfsplanet_game_version_req = { path = "crates/lfsplanet_game_version_req", features = ["sea-orm"] }
lfsplanet_hotlaps = { path = "crates/lfsplanet_hotlaps" }
lfsplanet_jobs = { path = "crates/lfsplanet_jobs" }
lfsplanet_lfs_installations = { path = "crates/lfsplanet_lfs_installations" }
lfsplanet_lfs_net_api = { path = "crates/lfsplanet_lfs_net_api", features = ["openapi", "sea-orm"] }
lfsplanet_lfs_net_leagues = { path = "crates/lfsplanet_lfs_net_leagues" }
lfsplanet_pubstat_types = { path = "crates/lfsplanet_pubstat_types" }
lfsplanet_race_calendar = { path = "crates/lfsplanet_race_calendar" }
lfsplanet_spr = { path = "crates/lfsplanet_spr" }
memchr = "2"
oauth2 = "5"
object_store = "0.14"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
sea-orm = { version = "2", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
size = { version = "0.6.0", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "time"] }
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs", "set-header", "timeout", "trace"] }
tower-sessions = { version = "0.15", features = ["private"] }
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores.git", rev = "e6534bcc885715ba9e77153c86980233bfa77360", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
validator = { version = "0.21", features = ["derive"] }

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-response-cache = { workspace = true }
celes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
csv = { workspace = true }
encoding_rs = { workspace = true }
fake = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
insim_core = { workspace = true }
lfsplanet_core = { workspace = true }
lfsplanet_country_ext = { workspace = true }
lfsplanet_hotlaps = { workspace = true }
lfsplanet_jobs = { workspace = true }
lfsplanet_lfs_installations = { workspace = true }
lfsplanet_lfs_net_api = { workspace = true }
lfsplanet_pubstat_types = { workspace = true }
lfsplanet_race_calendar = { workspace = true }
lfsplanet_spr = { workspace = true }
oauth2 = { workspace = true }
object_store = { workspace = true }
rand = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
size = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
lfsplanet_hotlaps = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
