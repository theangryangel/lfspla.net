[package]
name = "lfsplanet"
version = "0.1.0"
edition = "2024"
publish = false
homepage = "https://github.com/theangryangel/lfspla.net/"

[features]
test-database = []

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation and attribute conventions this crate does not follow.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Control configuration and API payloads are genuinely flag sets.
struct_excessive_bools = "allow"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = "4"
insim = { git = "https://github.com/theangryangel/insim.rs.git", rev = "6b1ecc961b23227df1ac9d0f96a7ecf03ba309f0", features = ["serde"] }
insim_core = { git = "https://github.com/theangryangel/insim.rs.git", rev = "6b1ecc961b23227df1ac9d0f96a7ecf03ba309f0", features = ["serde"] }
insim_pth = { git = "https://github.com/theangryangel/insim.rs.git", rev = "6b1ecc961b23227df1ac9d0f96a7ecf03ba309f0" }
lfsplanet_game_version_req = { path = "crates/lfsplanet_game_version_req" }
oauth2 = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false }
sea-orm = "2"
serde = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
url = "2"

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
axum-response-cache = "0.5"
celes = "2.8.2"
clap = { workspace = true, features = ["derive"] }
csv = "1"
futures = "0.3"
hex = "0.4"
insim = { workspace = true }
insim_core = { workspace = true }
itertools = "0.15"
lfsplanet_game_version_req = { workspace = true, features = ["sea-orm"] }
lfsplanet_jobs = { path = "crates/lfsplanet_jobs" }
lfsplanet_lfs = { path = "crates/lfsplanet_lfs" }
lfsplanet_lfs_api = { path = "crates/lfsplanet_lfs_api" }
lfsplanet_spr = { path = "crates/lfsplanet_spr" }
oauth2 = { workspace = true }
object_store = "0.12"
rand = "0.10"
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
sea-orm = { workspace = true, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = "1.1"
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sha2 = "0.11"
size = { version = "0.5.0", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "time"] }
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "set-header", "timeout", "trace"] }
tower-sessions = { version = "0.15", features = ["private"] }
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores.git", rev = "d18c9bf76f1d4fb73130dbe5aa643197f14b5d2d", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
