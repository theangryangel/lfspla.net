[package]
name = "lfsplanet_lfs_leagues"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fetch and parse public Live for Speed league schedules"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
scraper = "0.29"
serde = { workspace = true, features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[lints]
workspace = true
