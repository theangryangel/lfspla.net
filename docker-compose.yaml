name: lfsplanet

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lfsplanet
      POSTGRES_PASSWORD: lfsplanet
      POSTGRES_DB: lfsplanet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfsplanet -d lfsplanet"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
